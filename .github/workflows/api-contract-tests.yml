name: api-contract-tests
on:
  pull_request:

jobs:
  postman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the service
        run: |
          nohup npm start > service.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Service is up"
              exit 0
            fi
            sleep 1
          done
          echo "Service did not become healthy in 30s"
          cat service.log
          exit 1

      - name: Install the Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Sign in to Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run the collection
        run: postman collection run postman/collections/orders -e postman/environments/ci.yaml
